# Compila o app iOS SEM assinatura e publica o .ipa como artefato.
#
# A assinatura acontece localmente, em Linux, com certificado de Apple ID
# gratuito — nenhuma credencial da Apple entra neste workflow.
# Ver mobile/specs/001-coreml-proof/quickstart.md § Parte 4.

name: iOS build (unsigned)

on:
  push:
    branches: ['mobile/**']
    paths:
      - 'mobile/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Gera ios/ a partir de app.config.js. A pasta nao e versionada:
      # Continuous Native Generation, ver a constituicao.
      - name: Prebuild
        run: npx expo prebuild --platform ios --clean

      - name: Install pods
        run: pod install
        working-directory: mobile/ios

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -workspace ios/vizi.xcworkspace \
            -scheme vizi \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # Um .ipa e um zip com o .app dentro de Payload/.
      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/vizi.app Payload/
          zip -qry vizi-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: vizi-unsigned-ipa
          path: mobile/vizi-unsigned.ipa
          retention-days: 30
