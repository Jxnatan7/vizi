# Compila o app iOS SEM assinatura e publica o .ipa como artefato.
#
# A assinatura acontece localmente, em Linux, com certificado de Apple ID
# gratuito — nenhuma credencial da Apple entra neste workflow.
# Ver mobile/specs/001-coreml-proof/quickstart.md § Parte 4.

name: iOS build (unsigned)

on:
  push:
    branches: ['mobile/**']
    paths:
      - 'mobile/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile

    # Duas configuracoes, por motivos diferentes e incompativeis:
    #
    #   Debug   -> traz o dev launcher do expo-dev-client e carrega o JS do
    #              Metro. E o unico que permite iterar em JavaScript sem
    #              recompilar (SC-004). Swift compila com -Onone.
    #   Release -> JS embutido, Swift otimizado. E o unico valido para MEDIR
    #              (SC-001): em Debug o Decode.swift roda sem otimizacao e o
    #              cycleMs sai inflado.
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Gera ios/ a partir de app.config.js. A pasta nao e versionada:
      # Continuous Native Generation, ver a constituicao.
      - name: Prebuild
        run: npx expo prebuild --platform ios --clean

      - name: Install pods
        run: pod install
        working-directory: mobile/ios

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/vizi.xcworkspace \
            -scheme vizi \
            -configuration ${{ matrix.configuration }} \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$RUNNER_TEMP/build.log"

      # O log do xcodebuild e imenso e enterra a causa entre centenas de
      # avisos de script phase. Este passo isola as linhas que importam.
      - name: Erros de compilacao
        if: failure()
        run: |
          echo "::group::error:"
          grep -E "error:" "$RUNNER_TEMP/build.log" | head -40 || echo "(nenhuma linha 'error:' no log)"
          echo "::endgroup::"

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/${{ matrix.configuration }}-iphoneos/vizi.app Payload/
          zip -qry vizi-${{ matrix.configuration }}-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: vizi-${{ matrix.configuration }}-unsigned-ipa
          path: mobile/vizi-${{ matrix.configuration }}-unsigned.ipa
          retention-days: 30
